<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BORAVIVER VIAGENS | Cliente</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
:root{
--azul:#00cfff;--azul2:#1d4ed8;--rosa:#e84a9b;--glass:rgba(255,255,255,.08)
}
body{background:linear-gradient(135deg,#081423,#102f4f);color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);position:sticky;top:0}
.logo{height:95px}
.btn{padding:12px 20px;border:none;border-radius:30px;cursor:pointer}
.logout{background:#ef4444;color:#fff}
.wrap{padding:30px}
.glass{background:var(--glass);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:20px;backdrop-filter:blur(16px)}
.banner{margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{background:rgba(255,255,255,.05);padding:20px;border-radius:20px;transition:.3s}
.card:hover{transform:translateY(-6px)}
.price{color:#ffd166;font-size:26px;font-weight:700}
.section{margin-top:25px}
.fab{position:fixed;bottom:25px;right:25px;background:#25d366;color:#fff;width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none}
</style>
</head>
<body>
<nav class="nav">
<img src="../assets/logo.png" class="logo">
<button class="btn logout" id="logoutBtn">Sair</button>
</nav>

<div class="wrap">
<div class="glass banner">
<h1>Promoções em Tempo Real</h1>
<p>Atualizadas pelo painel administrativo.</p>
<div id="promocoes" class="grid"></div>
</div>

<div class="glass section">
<h2>Pacotes</h2>
<div id="pacotes" class="grid"></div>
</div>

<div class="glass section">
<h2>Passagens</h2>
<div id="passagens" class="grid"></div>
</div>

<div class="glass section">
<h2>Hospedagens</h2>
<div id="hospedagens" class="grid"></div>
</div>

<div class="glass section">
<h2>Atividades</h2>
<div id="atividades" class="grid"></div>
</div>
</div>

<a class="fab" href="https://wa.me/5561999999999" target="_blank"><i class="fab fa-whatsapp"></i></a>

<script>
const SUPABASE_URL="https://grxvopbjovyymdzuuocb.supabase.co";
const SUPABASE_KEY="sb_publishable_7vRsWje32gB7StqxliSvvA_cn4CpMji";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function card(item){
 return `<div class="card"><h3>${item.titulo||item.nome||'Item'}</h3>
 <p>${item.descricao||''}</p>
 <div class="price">R$ ${Number(item.valor||0).toLocaleString('pt-BR')}</div></div>`;
}

async function carregarTabela(tabela,id){
 try{
 const {data}=await supabase.from(tabela).select('*');
 document.getElementById(id).innerHTML=(data||[]).map(card).join('');
 }catch(e){console.log(e)}
}

async function carregarTudo(){
 await carregarTabela('promocoes','promocoes');
 await carregarTabela('pacotes','pacotes');
 await carregarTabela('passagens','passagens');
 await carregarTabela('hospedagens','hospedagens');
 await carregarTabela('atividades','atividades');
}

document.getElementById('logoutBtn').onclick=async()=>{
 try{await supabase.auth.signOut()}catch(e){}
 location.href='../index.html';
};

['promocoes','pacotes','passagens','hospedagens','atividades'].forEach(t=>{
 supabase.channel(t).on('postgres_changes',
 {event:'*',schema:'public',table:t},
 ()=>carregarTudo()).subscribe();
});

carregarTudo();
</script>
</body>
</html>
