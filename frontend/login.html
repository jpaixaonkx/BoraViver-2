<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BORAVIVER VIAGENS</title>
    
    <meta name="description" content="Acesse o portal BORAVIVER VIAGENS e gerencie suas viagens ou seu painel administrativo.">
    <meta property="og:title" content="Login | BORAVIVER VIAGENS">
    <meta property="og:description" content="Acesse sua conta na plataforma premium de turismo.">
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --azul-neon: #00f0ff;
            --azul-oceano: #0072ff;
            --rosa-magenta: #ff007f;
            --amarelo-dourado: #ffbd59;
            --preto: #0b0c10;
            --branco: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, var(--azul-oceano) 0%, var(--preto) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: var(--branco);
        }

        /* Efeito de Vidro (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 450px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.2);
        }

        .brand-logo {
            max-width: 180px;
            display: block;
            margin: 0 auto 1.5rem auto;
            filter: drop-shadow(0px 4px 10px rgba(255, 0, 127, 0.5));
        }

        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--azul-neon);
            margin-bottom: 0.5rem;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--azul-neon);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--branco);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--rosa-magenta);
            color: var(--branco);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .btn-premium {
            background: linear-gradient(45deg, var(--rosa-magenta), var(--azul-oceano));
            border: none;
            color: var(--branco);
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-premium:hover {
            background: linear-gradient(45deg, var(--azul-oceano), var(--rosa-magenta));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.4);
        }

        /* Botão Voltar Secundário */
        .btn-outline-custom {
            background: transparent;
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: var(--azul-neon);
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-outline-custom:hover {
            background: rgba(0, 240, 255, 0.1);
            color: var(--branco);
            border-color: var(--azul-neon);
            transform: translateY(-1px);
        }

        .alert-custom {
            background: rgba(255, 0, 127, 0.2);
            border: 1px solid var(--rosa-magenta);
            color: var(--branco);
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center align-items-center">
        <div class="glass-card animate__animated animate__fadeInUp">
            
            <img src="./assets/logo.png" alt="BORAVIVER VIAGENS" class="brand-logo img-fluid">
            
            <h3 class="text-center mb-4 font-weight-bold" style="color: var(--branco);">Bem-vindo</h3>
            
            <div id="loginAlert" class="alert alert-custom animate__animated animate__shakeX" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i> <span id="alertMessage">Erro ao fazer login.</span>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" placeholder="seu@email.com" required autocomplete="email">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="Sua senha" required autocomplete="current-password">
                    </div>
                </div>
                    <div class="mb-3 d-flex justify-content-center">
    <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="adminToggle" onchange="toggleAdminMode()">
        <label class="form-check-label text-light" for="adminToggle" id="userLabel">Login de Cliente</label>
    </div>
</div>

<script>
function toggleAdminMode() {
    const toggle = document.getElementById('adminToggle');
    const label = document.getElementById('userLabel');
    const form = document.getElementById('loginForm'); // Certifique-se de dar ID ao seu form
    
    if (toggle.checked) {
        label.textContent = "Acesso Administrativo";
        label.style.color = "var(--rosa-magenta)"; // Destaque sutil para admin
        form.action = "../frontend/admin/dashboard.html"; // Altere para sua rota de admin
    } else {
        label.textContent = "Login de Cliente";
        label.style.color = "var(--branco)";
        form.action = "../frontend/cliente/cliente.html"; // Altere para sua rota padrão
    }
}
</script>

                <button type="submit" class="btn btn-premium w-100 mb-2" id="btnEntrar">
                    <span id="btnText">Entrar</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>

                <a href="./index.html" class="btn btn-outline-custom w-100 mb-3 text-center text-decoration-none d-block">
                    <i class="fas fa-arrow-left me-2"></i>Voltar ao Início
                </a>
            </form>

            <div class="text-center mt-3">
                <p class="small text-muted mb-0">Não possui uma conta? <a href="./cadastro.html" style="color: var(--azul-neon); text-decoration: none; font-weight: 600;">Cadastre-se</a></p>
            </div>
            
        </div>
    </div>
      
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="./assets/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // 1. Configuração única e inicialização global da constante 'supabase'
        const SUPABASE_URL = "https://grxvopbjovyymdzuuocb.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_7vRsWje32gB7StqxliSvvA_cn4CpMji";

        // ESSA DEVE SER A ÚNICA VEZ QUE "const supabase" APARECE NO ARQUIVO
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Mapeamento dos elementos do DOM
        const loginForm = document.getElementById('loginForm');
        const loginAlert = document.getElementById('loginAlert');
        const alertMessage = document.getElementById('alertMessage');
        const btnEntrar = document.getElementById('btnEntrar');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        loginForm.addEventListener('submit', async (e) => {

    e.preventDefault();

    loginAlert.style.display = 'none';

    btnEntrar.disabled = true;
    btnText.textContent = 'Autenticando...';
    btnSpinner.classList.remove('d-none');

    try {

        const email =
        document.getElementById('email').value;

        const password =
        document.getElementById('password').value;

        const {
            data: authData,
            error: authError
        } =
        await supabase.auth.signInWithPassword({

            email,
            password

        });

        if (authError) throw authError;

        const user = authData.user;

        const {
            data: userData,
            error: userError
        } =
        await supabase
        .from('users')
        .select('role')
        .eq('id', user.id)
        .single();

        if (userError) throw userError;

        console.log('Usuário:', user);
        console.log('Perfil:', userData);

        if (userData.role === 'ADMIN') {

            window.location.replace(
                '../admin/dashboard.html'
            );

        } else {

            window.location.replace(
                '../cliente/cliente.html'
            );

        }

    } catch (error) {

        console.error(error);

        alertMessage.textContent =
        error.message;

        loginAlert.style.display =
        'block';

        btnEntrar.disabled = false;

        btnText.textContent = 'Entrar';

        btnSpinner.classList.add('d-none');

    }

});
    </script>
</body>
</html>
