<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BORAVIVER VIAGENS</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { --azul-neon: #00f0ff; --azul-oceano: #0072ff; --rosa-magenta: #ff007f; --preto: #0b0c10; --branco: #ffffff; }
        body { font-family: 'Poppins', sans-serif; background: radial-gradient(circle at center, var(--azul-oceano) 0%, var(--preto) 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--branco); }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 3rem; width: 100%; max-width: 450px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .brand-logo { max-width: 180px; display: block; margin: 0 auto 1.5rem auto; filter: drop-shadow(0px 4px 10px rgba(255, 0, 127, 0.5)); }
        .form-control { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--branco); }
        .btn-premium { background: linear-gradient(45deg, var(--rosa-magenta), var(--azul-oceano)); border: none; color: var(--branco); padding: 0.75rem; border-radius: 10px; width: 100%; font-weight: 600; }
        .btn-outline-custom { background: transparent; border: 1px solid var(--azul-neon); color: var(--azul-neon); padding: 0.75rem; border-radius: 10px; width: 100%; text-decoration: none; display: block; text-align: center; margin-top: 10px; }
        .alert-custom { background: rgba(255, 0, 127, 0.2); border: 1px solid var(--rosa-magenta); color: var(--branco); border-radius: 10px; display: none; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="glass-card animate__animated animate__fadeInUp">
            <img src="./assets/logo.png" alt="BORAVIVER" class="brand-logo img-fluid">
            
            <div id="loginAlert" class="alert alert-custom" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i> <span id="alertMessage"></span>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-info">E-mail</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-info">Senha</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                
                <button type="submit" class="btn btn-premium" id="btnEntrar">
                    <span id="btnText">Entrar</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none"></span>
                </button>
            </form>

            <a href="cadastro.html" class="btn btn-outline-custom">Criar Nova Conta</a>
        </div>
    </div>
      
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Inicialização única: Verificamos se já existe para evitar o erro de re-declaração
        if (typeof window.supabaseClient === 'undefined') {
            window.supabaseClient = window.supabase.createClient(
                "https://grxvopbjovyymdzuuocb.supabase.co", 
                "sb_publishable_7vRsWje32gB7StqxliSvvA_cn4CpMji"
            );
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnEntrar = document.getElementById('btnEntrar');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const loginAlert = document.getElementById('loginAlert');
            
            btnEntrar.disabled = true;
            btnText.textContent = 'Processando...';
            btnSpinner.classList.remove('d-none');
            loginAlert.style.display = 'none';

            try {
                // Autenticação
                const { data: authData, error: authError } = await window.supabaseClient.auth.signInWithPassword({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });

                if (authError) throw authError;

                // Busca o perfil na tabela 'users'
                const { data: userData, error: userError } = await window.supabaseClient
                    .from('users')
                    .select('role')
                    .eq('id', authData.user.id)
                    .single();

                // Define rota baseada na role
                const role = userData ? userData.role : 'CLIENTE';
                
                if (role === 'ADMIN') {
                    window.location.href = './admin/dashboard.html';
                } else {
                    window.location.href = './cliente/cliente.html';
                }
            } catch (error) {
                document.getElementById('alertMessage').textContent = error.message;
                loginAlert.style.display = 'block';
                btnEntrar.disabled = false;
                btnText.textContent = 'Entrar';
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
